        찾으러 가는 느낌으로. 지금은 복도 끝에서 나와 끝으로 가다가 벽에서 사라져」 ③ 「너무 자주 계속 나와」
   09-13 결정: 가짜 통행인(겉모습만 바꾼 12벌)을 없애고 **이미 불러온 방의 직원**이 오간다. 같은 사람이라 얼굴 중복이 원천적으로 없다.
   한 번의 왕래(trip):
     out   — 자기 자리에서 일어나(그 방은 지금 안 보인다) 자기 팀 문으로 복도에 나와 → 다른 팀 문으로 들어간다
     visit — 그 방에서 12~25초 머문다. 플레이어가 그 방에 있으면 팀장 책상 앞에 서 있고, 그동안은 떠나지 않는다
     back  — 다시 복도로 나와 자기 팀 문으로 들어가 **자기 homeSeat 에 앉는다**
   규칙
     · 플레이어가 **지금 있는 방의 사람은 출발하지 않는다**(보고 있는 방에서 사람이 사라지지 않게). 팀장은 자리를 지킨다.
     · 플레이어가 그 사람의 방에 들어가면(setRoom) 이미 돌아와 앉아 있다 — 연출(interact)이 그 사람을 찾을 때 비어 있지 않게.
     · 복도에 동시에 최대 2명, 새 출발은 20~40초 간격. 복도에 들어오면 첫 등장은 6~12초 뒤.
     · 문은 열리고 닫힌다. 문턱을 넘을 때 스며 나오고 스며든다(setOpacity). **복도 끝·벽에서 사라지지 않는다.**
     · 지나가는 동안 플레이어·다른 직원과 부딪히면 통로에서는 옆으로 비키고 문 앞에서는 잠깐 선다.
   위치는 플레이어가 어디에 있든 계속 진행된다(복도에 들어오는 순간 그 자리에 보인다). 그림은 복도·방문한 방에 있을 때만 그린다. */
const TRAF={trips:[],next:-1,recent:[],hist:[],guests:[],guestLoading:false,guestNext:0,guestLog:[]};
const TRAF_CFG={gap:[20,40],first:[6,12],visit:[12,25],speed:WALK_NEW?0.85:1.0,fadeD:0.7,maxCorr:2,maxTrips:3,recentN:3,guestMax:6};
/* ── 45차 보강: 「손님 직원」(대표 첫 지적 「시간이 지나도 계속 동일한 사람들이 왔다갔다」) ──
   불러온 방이 내 방뿐이면 복도에 내 팀 직원 둘셋만 반복해서 오간다. 복도에서는 방 안이 보이지 않으므로
   다른 팀 **방을 짓지 않고 그 팀 직원 모델만** 불러 문에서 스며 나오게 한다.
   · **로딩 화면 단계에서** 내 팀 동료와 **동시에** 받는다(warm, 기본). 최대 6명(팀당 1명).
     실측(tools/_gpu_guest45.mjs, 캐시 있음): ready 3.0·3.6초 → 5.2·5.4초(+2초) — 게임 중 끊김 0.
     대안 ?guests=bg(준비 뒤 내 방에서 한 명씩): 12.5초 동안 50ms 넘는 프레임 11번·최대 150ms → 대표가 렉에 민감해 기본에서 뺐다.
     ?guests=0 끔.
   · 그 팀 방에 처음 들어가면(ensureRoom) 새로 불러오지 않고 **그 사람을 그대로 자리에 앉힌다**(같은 사람 두 벌 금지). */
const GUESTS_MODE=(Q.get('guests')||'warm').toLowerCase();
const trafCorr=()=>TRAF.trips.filter(t=>t.phase!=='visit');
function doorFree(team){ return !trafCorr().some(t=>t.from===team||t.dest===team); }
function trafficRoute(tr,from,to){ const D=CORRIDOR.doorInfo, a=D[from], b=D[to], dir=Math.sign(b.x-a.x)||1, lane=dir>0?0.45:-0.45;
  Object.assign(tr,{a,b,from,dest:to,i:0,off:0,wait:0,closeFrom:false,openTo:false,shown:false,hold:0.55,x:a.x,z:a.zw+a.sgn*0.12});

  if(CORRIDOR.doors[from]) CORRIDOR.doors[from].want=1.35; }
function trafficStart(){
  if(BUSY||!CORRIDOR||trafCorr().length>=TRAF_CFG.maxCorr||TRAF.trips.length>=TRAF_CFG.maxTrips) return false;
  const D=CORRIDOR.doorInfo||{}; const P0=(CUR===CORRIDOR&&PLAYER&&PLAYER.model.visible)?PLAYER.model.position:null;
  const nearDoor=(t)=>P0&&Math.hypot(P0.x-D[t].x,P0.z-(D[t].zw-D[t].sgn*0.8))<1.6;
  const cands=[]; const onTrip=new Set(TRAF.trips.map(t=>t.c.CH));
  for(const k in ROOMS){ const R=ROOMS[k]; if(R===CUR||!R.loaded||!D[k]||!doorFree(k)||nearDoor(k)) continue;
    for(const c of R.chars){ if(!c.homeSeat||c.homeSeat.id==='lead'||c.extraSeat||c.loan||LOANED[c.CH]||c.trip||c.seat!==c.homeSeat||TRAF.recent.includes(c)||onTrip.has(c.CH)) continue;
      if(c.ai&&(c.ai.busy||c.ai.talking)) continue; cands.push({c,R:{team:k,name:R.name}}); } }
  for(const c of TRAF.guests){ const k=c.guestTeam; if(c.trip||LOANED[c.CH]||!D[k]||ROOMS[k]||(CUR&&CUR.team===k)||!doorFree(k)||nearDoor(k)||TRAF.recent.includes(c)||onTrip.has(c.CH)) continue;
    cands.push({c,R:{team:k,name:TEAM_NAMES[k]||k}}); }
  if(!cands.length) return false;
  /* 오래 안 나간 사람부터(한 번도 안 나간 사람이 가장 먼저) — 같은 얼굴이 되풀이되지 않게 */
  const oldest=Math.min(...cands.map(x=>x.c.lastTrip||-1e9)); const pool=cands.filter(x=>(x.c.lastTrip||-1e9)<=oldest+1);
  const {c,R}=pickOne(pool); c.lastTrip=SIM_T;
  const tos=TEAM_ORDER.filter(t=>t!==R.team&&!(CUR&&CUR.team===t)&&D[t]&&doorFree(t)&&!nearDoor(t));
  const far=tos.filter(t=>Math.abs(D[t].x-D[R.team].x)>=3); const to=pickOne(far.length?far:tos); if(!to) return false;
  try{ c.standUp(); }catch(e){} c.clearSeatOffset&&c.clearSeatOffset(); c.model.visible=false;
  c.ai=c.ai||{next:0,busy:false,talking:false,why:''}; c.ai.busy=true; c.ai.why=`${TEAM_NAMES[to]||to} 다녀오기`;
  const tr={c,home:R.team,to,phase:'out'}; trafficRoute(tr,R.team,to); TRAF.trips.push(tr); c.trip=tr;
  TRAF.recent.push(c); while(TRAF.recent.length>TRAF_CFG.recentN) TRAF.recent.shift();
  TRAF.hist.push({t:+SIM_T.toFixed(1),who:c.label||c.CH,ch:c.CH,from:R.team,to}); if(TRAF.hist.length>80) TRAF.hist.shift();
  log(`왕래 시작: ${R.name} ${c.label||c.CH} → ${TEAM_NAMES[to]||to}`); return true; }
function trafficFinish(tr){ const c=tr.c, s=c.homeSeat; const i=TRAF.trips.indexOf(tr); if(i>=0) TRAF.trips.splice(i,1);
  c.trip=null; c.setOpacity(1); c.model.visible=false; c.mode='idle'; c.play('idle');
  if(s){ evictSeat(s,c); c.model.rotation.y=s.ry; c.sitAt(s,false); }   /* sitAt → showIfHere: 그 방에 있을 때만 보인다 */
  if(c.ai){ c.ai.busy=false; c.ai.why=''; c.ai.next=SIM_T+rnd(20,50); } }
function trafficShowVisit(tr){ const c=tr.c, m=c.model, R=CUR;
  if(!tr.spot){ const used=new Set(TRAF.trips.filter(t=>t!==tr&&t.spot).map(t=>t.spot));
    tr.spot=['lead_front','lead_side','board'].find(k=>R.STATIONS[k]&&!used.has(k))||'board'; const st=R.STATIONS[tr.spot];
    m.position.set(st.x,m.userData.base||0,st.z); const L=R.SEATS.lead; if(L){ const lp=L.wp(0,0,0); m.rotation.y=Math.atan2(lp.x-st.x,lp.z-st.z); }
    c.setOpacity(1); c.mode='idle'; c.play('idle'); }
  m.visible=true; }
function trafficArrive(tr){ const c=tr.c, door=tr.dest;
  waitSim(0.45).then(()=>{ if(CORRIDOR.doors[door]&&doorFree(door)) CORRIDOR.doors[door].want=0; });
  if(tr.phase==='out'){
    if(CUR&&CUR.team===tr.to){ tr.i=tr.pts.length-1; tr.hold=1.0; c.model.visible=false; return; }   /* 플레이어가 그 방에 있다 — 눈앞에 튀어나오지 않게 문 뒤에서 기다린다 */
    tr.phase='visit'; tr.visitT=rnd(TRAF_CFG.visit[0],TRAF_CFG.visit[1]); tr.spot=null; c.setOpacity(1); c.model.visible=false; c.mode='idle'; c.play('idle'); return; }

function trafficStep(tr,dt,inCorr){ const c=tr.c, m=c.model;
  if(tr.phase==='visit'){ const here=!!(CUR&&CUR.team===tr.to&&ROOMS[tr.to]===CUR);
    if(here&&!tr.eject) trafficShowVisit(tr); else if(m.visible) m.visible=false;
    if(here&&!tr.eject) return;                              /* 보고 있는 동안은 떠나지 않는다 */
    tr.visitT-=dt; if(tr.visitT>0) return;
    if(trafCorr().length>=TRAF_CFG.maxCorr||!doorFree(tr.to)||!doorFree(tr.home)){ tr.visitT=1.5; return; }
    tr.phase='back'; tr.spot=null; tr.eject=false; trafficRoute(tr,tr.to,tr.home); return; }
  if(tr.hold>0){ tr.hold-=dt;
    if(inCorr){ m.position.set(tr.x,m.userData.base||0,tr.z); m.rotation.y=Math.atan2(0,-tr.a.sgn); c.setOpacity(0); if(c.mode!=='idle'){ c.mode='idle'; c.play('idle'); } m.visible=true; }
    else m.visible=false;
    return; }
  const tgt=tr.pts[tr.i]; const onLane=(tr.i===2); const tz=tgt.z+(onLane?tr.off:0);
  const trSp=paceSpeed(c,TRAF_CFG.speed);   /* ?walk=A|B|C: 복도 왕래도 그 사람 고유 속도 */
  if(WALK_NEW) tr.v=(tr.v==null?0:tr.v)+(trSp-(tr.v||0))*Math.min(1,dt/0.14);   /* 새 걷기: 출발 가속 */
  const dx=tgt.x-tr.x, dz=tz-tr.z, d=Math.hypot(dx,dz), step=(WALK_NEW?tr.v:TRAF_CFG.speed)*dt;
  if(inCorr&&d>1e-4){ let blocked=false, dodge=false;
    /* 앞 1.4m 구간에 사람이 0.85m 안으로 들어오면 — 통로에서는 미리 옆으로 비키고, 문 앞 구간에서는 0.9m 앞에서 선다 */
    const ah=Math.min(1.4,d), ex=dx/d, ez=dz/d;
    const others=trafCorr().filter(t=>t!==tr&&t.c.model.visible).map(t=>t.c.model.position); if(PLAYER&&PLAYER.model.visible) others.push(PLAYER.model.position);
    for(const o of others){ const ox=o.x-tr.x, oz=o.z-tr.z, along=ox*ex+oz*ez; if(along<-0.2||along>ah+0.4) continue;
      const lat=Math.abs(ox*ez-oz*ex); if(lat>0.85) continue;
      if(onLane){ dodge=true; const side=(o.z>tr.z)?-1:1; tr.off+=(side*0.95-tr.off)*Math.min(1,dt*4); }
      else if(Math.hypot(ox,oz)<0.9) blocked=true;
      break; }
    if(!dodge&&onLane) tr.off*=Math.max(0,1-dt*0.8);
    if(blocked&&tr.wait<3){ tr.wait+=dt; tr.v=0; if(c.mode!=='idle'){ c.mode='idle'; c.play('idle'); } return; }
    if(!blocked) tr.wait=0; }
  let mvx=0, mvz=0;
  if(onLane){   /* 통로: 앞으로는 x 로만 걷고, 비키는 폭(off)은 z 로 곧장 옮긴다 — 목표점 쪽 대각선으로 섞으면 8m 앞 목표라 비키는 데 한참 걸렸다 */
    const ddx=tgt.x-tr.x, sx=Math.sign(ddx)||1, fw=Math.min(Math.abs(ddx),step); const dzz=Math.max(-0.9*dt,Math.min(0.9*dt,tz-tr.z));
    tr.x+=sx*fw; tr.z+=dzz; mvx=sx*fw; mvz=dzz;
    if(Math.abs(ddx)<=step){ tr.i++; } }
  else if(d<=step){ mvx=tgt.x-tr.x; mvz=tz-tr.z; tr.x=tgt.x; tr.z=tz; tr.i++; if(tr.i>=tr.pts.length){ trafficArrive(tr); return; } }
  else { mvx=dx/d*step; mvz=dz/d*step; tr.x+=mvx; tr.z+=mvz; }
  /* 46차(메인 전달 — 통행인이 플레이어에게 0.31m 까지 붙음): 움직인 뒤 플레이어와 0.45m 안이면 앞으로 간 만큼 되돌리고 옆으로만 비킨다 */
  if(inCorr&&PLAYER&&PLAYER.model.visible){ const pp=PLAYER.model.position, nd=Math.hypot(tr.x-pp.x,tr.z-pp.z);
    if(nd<0.45){ const od=Math.hypot(tr.x-mvx-pp.x,tr.z-mvz-pp.z); if(nd<od){ tr.x-=mvx; tr.z-=mvz; mvx=0; mvz=0; }
      if(Math.hypot(tr.x-pp.x,tr.z-pp.z)<0.45){ const ux=(tr.x-pp.x)||0.001, uz=(tr.z-pp.z)||0.001, ul=Math.hypot(ux,uz); const push=Math.min(0.9*dt,0.45-ul); tr.x+=ux/ul*push; tr.z+=uz/ul*push; } } }
  if(!tr.closeFrom&&tr.i>=2){ tr.closeFrom=true; const fr=tr.from; if(CORRIDOR.doors[fr]&&!trafCorr().some(t=>t!==tr&&(t.from===fr||t.dest===fr))) CORRIDOR.doors[fr].want=0; }
  if(!tr.openTo&&tr.i>=3&&Math.hypot(tr.x-tr.pts[3].x,tr.z-tr.pts[3].z)<1.3){ tr.openTo=true; if(CORRIDOR.doors[tr.dest]) CORRIDOR.doors[tr.dest].want=1.35; }
  if(!inCorr){ if(m.visible) m.visible=false; tr.shown=false; return; }
  if(WALK_NEW&&(c.mode!=='walk'||c.clipKey!=='walk')){ if(!tr.shown&&Math.hypot(mvx,mvz)>1e-5) m.rotation.y=Math.atan2(mvx,mvz); c.mode='walk'; c.play('walk',{fade:0.2,direct:true}); }   /* 새 걷기: 옮기기 전에 걷기를 건다 — 서 있던 발 자리를 옮기기 전 위치로 붙든다 */
  m.position.x=tr.x; m.position.z=tr.z;
  if(Math.hypot(mvx,mvz)>1e-5){ const want=Math.atan2(mvx,mvz); if(!tr.shown) m.rotation.y=want; else { const df=Math.atan2(Math.sin(want-m.rotation.y),Math.cos(want-m.rotation.y)); if(PACE) paceTurn(m,df,dt); else if(WALK_NEW&&c.turnWalk){ const o=c.turnWalk(m.rotation.y+df*Math.min(1,dt*12)); tr.x+=o.x; tr.z+=o.z; m.position.x=tr.x; m.position.z=tr.z; } else m.rotation.y+=df*Math.min(1,dt*8); } }
  if(c.mode!=='walk'||c.clipKey!=='walk'){ c.mode='walk'; c.play('walk',{fade:0.2,direct:true}); c.walkSpeed&&c.walkSpeed(TRAF_CFG.speed); }   /* 44차: 클립까지 확인 — 걷기 클립이 안 걸리면 기마자세로 굳는다 */
  const dFrom=(tr.i<=1)?Math.abs(tr.z-tr.a.zw):9, dTo=(tr.i>=3)?Math.abs(tr.z-tr.b.zw):9;
  c.setOpacity(Math.min(1,Math.min(dFrom,dTo)/TRAF_CFG.fadeD));   /* 문턱에서 스며 나오고 스며든다 */
  m.visible=true; tr.shown=true; }
function guestPick(){ const loaded=new Set(CHARS.map(c=>c.CH).concat([PLAYER_USE],(CAST[HOME]||[]).map(x=>x[0]),EXTRA_NPC.map(x=>x[1]),Object.keys(LOANED)));
  const teams=TEAM_ORDER.filter(t=>t!==HOME&&!ROOMS[t]&&!TRAF.guests.some(g=>g.guestTeam===t)&&CAST[t]);
  const opts=[]; for(const t of teams){ for(const i of [1,2]){ const e=CAST[t][i]; if(e&&!loaded.has(e[0])) opts.push({t,i,e}); } }
  return opts.length?pickOne(opts):null; }
async function guestLoad(o){ const [ch,name,look]=o.e; const t0=performance.now();
  const c=await loadCharacter(ch,{anims:ANIMS_NPC,look:look||twinLook(ch),slice:GUESTS_MODE!=='warm'});
  c.label=name; c.guestTeam=o.t; c.guestSeatId=CAST_SEATS[o.i]; c.model.visible=false; c.ai={next:0,busy:false,talking:false,why:''};
  if(!c.model.parent) scene.add(c.model); if(!CHARS.includes(c))CHARS.push(c);TRAF.guests.push(c);
  /* 텍스처를 지금 GPU 에 올려 둔다 — 복도에서 처음 보일 때 멈추지 않게 */

  TRAF.guestLog.push({who:name,ch,team:o.t,ms:Math.round(performance.now()-t0)}); log(`손님 직원 ${TEAM_NAMES[o.t]} ${name}(${ch}) ${Math.round(performance.now()-t0)}ms`); return c; }
function guestTick(){
  if(GUESTS_MODE==='0'||GUESTS_MODE==='warm'||NOCHAR||!WARM.ready||TRAF.guestLoading||TRAF.guests.length>=TRAF_CFG.guestMax) return;
  if(CUR!==HOME_ROOM||BUSY||FADE.want>0||SIM_T<TRAF.guestNext) return;
  const o=guestPick(); if(!o){ TRAF.guestNext=SIM_T+30; return; }

  guestLoad(o).catch(e=>log('손님 직원 로드 실패',(e&&e.message)||e)).finally(()=>{ TRAF.guestLoading=false; TRAF.guestNext=SIM_T+2; }); }
function trafficTick(dt){
  if(!CORRIDOR) return;

  if(TRAF.next<0) TRAF.next=SIM_T+rnd(TRAF_CFG.first[0],TRAF_CFG.first[1]);
  if(SIM_T>=TRAF.next){ TRAF.next=trafficStart()?SIM_T+rnd(TRAF_CFG.gap[0],TRAF_CFG.gap[1]):SIM_T+3; }

/* 방이 바뀔 때(setRoom 끝에서) — 그 방 사람은 이미 돌아와 앉아 있고, 그 방을 방문 중인 사람은 팀장 책상 앞에 서 있다 */
function trafficOnRoom(R){

    if(tr.phase==='visit'&&R.team===tr.to){ tr.spot=null; continue; }   /* 다음 틱에 trafficShowVisit */
    c.model.visible=false; tr.shown=false; }

/* 연출(interact·goToTeam mode)이 그 방에서 시작될 때 — 방문객 직원을 내보낸다(보고하는 자리를 막지 않게) */

/* ══ 45차 후속: 모이기(play 계약 gather/ungather) ═══════════════════════════════════

function npcWalkPoint(c,x,z){ const from=nearestNode(c.model.position.x,c.model.position.z), to=nearestNode(x,z);

async function gather(ids,toId){ toId=toId||'lead'; const S0=SEATS&&SEATS[toId]; if(!S0||!CUR||CUR===CORRIDOR) return [];

/* 대화가 시작됐는데 아직 걸어오는 사람이 있으면 제자리에 바로 세운다 — 카메라가 걷는 사람(뒷모습·옆모습)을 잡지 않게.

/* 45차: 좌석에서 남을 「제대로」 비운다 — occupant 만 지우면 그 사람은 그대로 앉은 자세로 남는다 */

  try{ o.standUp(); }catch(e){ o.seat=null; }
  seat.occupant=null; log(`${(o.label||o.CH)} 를 ${seat.id||''} 에서 비움`); }
/* ══ 45차: 좌석 점유 불변식 ═══════════════════════════════════════════

   ① seat.occupant 와 c.seat 는 반드시 서로를 가리킨다. 어긋나면 양쪽을 다 푼다.
   ② occupant 가 아닌데 그 좌석을 쥐고 있는 사람은 앉은 자세를 풀어 떼어 낸다(겹쳐 앉기의 실체).

function seatSanity(R){ const S=R&&R.SEATS; if(!S) return;

renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; });

  /* 10초마다 지금 인물의 사본 폴더를 다시 훑어 단추만 갱신한다(파일이 나중에 도착해도 창을 새로 열 필요 없게). 불러오기는 단추를 눌렀을 때만 */
  setInterval(async()=>{ if(document.hidden||INS.loading||!INS.ch) return; const ch=INS.ch; try{ await variantsOf(ch,true); }catch(e){} if(ch===INS.ch&&!INS.loading) syncUI(); },10000);
  /* 목록 옆 진행 표시(46차 체크리스트) — docs/feedback46_status.json {"acnh_17":"완료",…} 이 있으면 그 글자, 없으면 최종 사진 shots/fix/final46_NN.jpg 가 있는 인물에 「사진」.
     없는 파일은 요청하지 않는다(폴더 목록으로 먼저 확인 — 404 가 콘솔 오류로 남지 않게). 30초마다 */
  async function progressTick(){ if(document.hidden) return; const mark={};
    try{ const shots=await listDir('shots/fix/'); if(shots) for(const f of shots){ const m=/^final46_(\d+)\.jpg$/.exec(f); if(m) mark['acnh_'+m[1]]='사진'; } }catch(e){}
    try{ const docs=await listDir('docs/'); if(docs&&docs.includes('feedback46_status.json')){ const j=await (await F0('docs/feedback46_status.json?v='+Date.now().toString(36))).json(); for(const [k,v] of Object.entries(j||{})) if(typeof v==='string') mark[k]=v; } }catch(e){}
    for(const r of panel.querySelectorAll('#insList .row')){ const t=mark[r.dataset.ch]||''; const k=r.querySelector('.k'); if(k.textContent!==t) k.textContent=t; } }
  progressTick(); setInterval(progressTick,30000);
  window.__inspect={ roster:()=>ROSTER.map(r=>r.ch), show:(ch)=>show(ch), pose:(p)=>setPose(p), cam:(n)=>camPreset(CAM_ALIAS[n]||n),
    face:(f)=>{ if(!FACES.includes(f)) return false; INS.face=f; applyLooks(INS.c); syncUI(); return true; },
    set:(k,v)=>{ if(!(k in TOG)) return false; INS[k]=!!v; applyLooks(INS.c); syncUI(); return true; }, refresh,
    variant:(n)=>setVariant(n), faceY:(v)=>setFaceY(v), variants:async(ch)=>{ const m=await variantsOf(pickCh(ch)||INS.ch); return Object.fromEntries([...m].map(([k,v])=>[k,Object.fromEntries(v)])); },
    state:()=>({ch:INS.ch,ready:!!(INS.c&&INS.c.CH===INS.ch&&!INS.loading),loading:INS.loading,err:INS.err,pose:INS.pose,cam:INS.cam,face:INS.face,decal:INS.decal,gray:INS.gray,blink:INS.blink,fidget:INS.fidget,loadMs:INS.loadMs,cache:[...INS.cache.keys()],v:INS.v,mode:INS.c&&INS.c.mode,clip:INS.c&&INS.c.clipKey,
      variant:INS.variant,loadedVariant:INS.c&&INS.c.__variant,varMissing:INS.varMissing,faceYReq:INS.faceY,faceYEff:INS.c&&INS.c.P?INS.c.P.faceY:null}),
    char:()=>INS.c, seat:SEAT };
  show(INS.ch);
})();
</script>
